[project]
name = "logistics-and-network-design"
version = "1.0.0"
description = "Output 6 - Logistics and Network Design (multi-state India)"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kushagra Kartikey"}]
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "ortools>=9.10",
  "pulp>=2.8", "highspy>=1.7", "simpy>=4.1", "networkx>=3.2", "folium>=0.16", "geopy>=2.4",
  "plotly>=5.20", "dash>=2.16", "openpyxl>=3.1", "pyarrow>=15", "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.44"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP007", "B905"]   # B905: zips are over arrays built with equal length

[tool.ruff.lint.per-file-ignores]
"src/logistics/reporting/excel_report.py" = ["E501"]   # KPI-definition data literals

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not smoke\""
markers = ["smoke: headless-browser tests against the built static dashboard"]
