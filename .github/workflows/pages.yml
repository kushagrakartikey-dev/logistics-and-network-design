name: Deploy dashboard to GitHub Pages

# Publishes the static control-tower dashboard (dashboard/static) on every push.
# The site is pre-built: data/payload.json is generated by the pipeline
# (python run_demo.py --modules all --export-reports) and committed, so this job
# only tests and publishes it. The full pipeline is exercised in ci.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Validate the build to be published
        run: python -c "import json; p = json.load(open('dashboard/static/data/payload.json')); assert len(p['meta']['cities']) == 5; print('payload ok,', p['meta']['generated'])"
      - name: Headless smoke test (local copy of the site)
        run: pytest -m smoke tests/smoke -q -p no:cacheprovider -o addopts=""
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-deployed:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Smoke test the published site
        env:
          DASHBOARD_URL: ${{ needs.deploy.outputs.page_url }}
        run: pytest -m smoke tests/smoke -q -p no:cacheprovider -o addopts=""
