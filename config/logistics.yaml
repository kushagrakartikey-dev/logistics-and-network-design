geography:
  anchor_sigma_deg: 0.0045
  # Network-wide straight-line-to-road conversion used for planning when no
  # zone calibration is available (zone circuity above is observed in trip logs)
  planning_circuity: 1.35

fleet:
  vehicle_types:
    VAN_2T:
      label: 2-ton van
      count: 10
      capacity_kg: 2000
      speed_kmph: 26
      cost_per_km: 18.0
      fixed_cost_per_day: 2800
      driver_wage_per_hour: 230
      max_route_minutes: 600
      # goods-vehicle entry restrictions in each city's core business district
      restricted_zones: [South Mumbai, Central Delhi, Central Bengaluru, Central Chennai, Central Kolkata]
      acquisition_cost: 2400000
      lease_per_month: 62000
      maintenance_per_km: 2.6
      insurance_per_year: 55000
      useful_life_years: 6
      residual_value_pct: 0.15
    TEMPO_1T:
      label: 1-ton tempo
      count: 10
      capacity_kg: 1000
      speed_kmph: 28
      cost_per_km: 13.0
      fixed_cost_per_day: 1900
      driver_wage_per_hour: 210
      max_route_minutes: 600
      restricted_zones: []
      acquisition_cost: 1050000
      lease_per_month: 31000
      maintenance_per_km: 1.8
      insurance_per_year: 28000
      useful_life_years: 6
      residual_value_pct: 0.15
    TWO_WHEELER:
      label: 2-wheeler
      count: 5
      capacity_kg: 40
      speed_kmph: 30
      cost_per_km: 3.5
      fixed_cost_per_day: 450
      driver_wage_per_hour: 160
      max_route_minutes: 480
      restricted_zones: []
      max_order_kg: 15
      acquisition_cost: 115000
      lease_per_month: 4200
      maintenance_per_km: 0.6
      insurance_per_year: 3500
      useful_life_years: 4
      residual_value_pct: 0.10
  # vehicles per depot role in every city (sums equal the per-city type counts)
  allocation_by_role:
    DC: {VAN_2T: 6, TEMPO_1T: 4, TWO_WHEELER: 0}
    MFC: {VAN_2T: 1, TEMPO_1T: 3, TWO_WHEELER: 3}
    HUB: {VAN_2T: 3, TEMPO_1T: 3, TWO_WHEELER: 2}
  operating_days_per_year: 310
  fuel_share_of_cost_per_km: 0.72
addresses:
  count_per_city: 500
  segment_mix: {ECOM_B2C: 0.60, FMCG_RETAIL: 0.17, MODERN_RETAIL: 0.11, AUTOMOTIVE: 0.12}

orders:
  base_daily_orders: 255          # per city at volume_weight 1.0
  segment_order_share: {ECOM_B2C: 0.62, FMCG_RETAIL: 0.17, MODERN_RETAIL: 0.10, AUTOMOTIVE: 0.11}
  weight_kg:     # lognormal (median, sigma) with clip bounds
    ECOM_B2C: {median: 2.4, sigma: 0.85, min: 0.2, max: 25}
    FMCG_RETAIL: {median: 120, sigma: 0.55, min: 25, max: 480}
    MODERN_RETAIL: {median: 170, sigma: 0.50, min: 40, max: 650}
    AUTOMOTIVE: {median: 75, sigma: 0.75, min: 8, max: 520}
  lines:          # order lines (SKU lines) per order: Poisson mean + 1
    ECOM_B2C: 1.2
    FMCG_RETAIL: 14
    MODERN_RETAIL: 22
    AUTOMOTIVE: 6
  express_share: {ECOM_B2C: 0.22, FMCG_RETAIL: 0.05, MODERN_RETAIL: 0.08, AUTOMOTIVE: 0.35}
  time_windows:   # [start, end] minutes since midnight
    ECOM_B2C: [[540, 720], [720, 900], [900, 1080], [1080, 1260]]
    ECOM_B2C_EXPRESS: [[600, 720], [840, 960], [1080, 1200]]
    FMCG_RETAIL: [[540, 780], [600, 960], [840, 1080]]
    MODERN_RETAIL: [[480, 720], [600, 900], [840, 1080]]
    AUTOMOTIVE: [[480, 720], [660, 900], [840, 1080]]
    AUTOMOTIVE_EXPRESS: [[480, 600], [660, 780], [840, 960]]
  service_minutes: {ECOM_B2C: 4.0, B2B_BASE: 10.0, B2B_PER_KG: 0.035}
  intake_window_min: [360, 1140]   # order intake 06:00-19:00 (for operations simulation)
  # Stocking policy by depot role: each order ships from its nearest stocking depot in its city
  stocking_roles:
    ECOM_B2C: [DC, MFC, HUB]
    FMCG_RETAIL: [HUB]
    MODERN_RETAIL: [DC]
    AUTOMOTIVE: [DC]

traffic:
  # Clock-time multipliers on free-flow travel time
  bands:
    - {name: early, start: 0, end: 480, factor: 1.0}
    - {name: morning peak, start: 480, end: 660, factor: 1.8}
    - {name: midday, start: 660, end: 1020, factor: 1.1}
    - {name: evening peak, start: 1020, end: 1260, factor: 2.2}
    - {name: night, start: 1260, end: 1440, factor: 1.0}

telematics:
  trip_logs_per_day: 120          # per city
  rain_travel_factor: 1.18
  vehicle_speed_factor: {VAN_2T: 1.06, TEMPO_1T: 1.00, TWO_WHEELER: 0.82}
  noise_sigma: 0.16

routing:
  objective: cost            # cost | distance | time
  time_limit_s: 30                # upper bound per depot; scaled by depot size
  seconds_per_order: 0.2
  first_solution: PATH_CHEAPEST_ARC
  metaheuristic: GUIDED_LOCAL_SEARCH
  drop_penalty: 1000000      # INR-scaled penalty for leaving an order unassigned
  duty_buffer_pct: 0.06      # plan routes to 94% of the duty limit (traffic replay headroom)
  outsourcing_cost: {ECOM_B2C: 220, FMCG_RETAIL: 2600, MODERN_RETAIL: 3200, AUTOMOTIVE: 2400}
  use_ml_travel_calibration: true
  representative_day: auto   # auto = median-volume non-event weekday

fleet_sizing:
  demand_multipliers: [0.5, 0.75, 1.0, 1.5, 2.0, 3.0]
  compliance_target: 0.95
  time_limit_s: 8                 # per depot, candidate-pool solve (decides the recommended fleet)
  current_time_limit_s: 3         # per depot, current-fleet check
  pool_factor: 1.6           # candidate pool = ceil(current * max(1,m) * pool_factor) per depot/type
  leasing_admin_pct: 0.03

warehouse:
  aisles: 50
  bays_per_side: 20
  levels: 5
  aisle_pitch_m: 3.2
  bay_width_m: 1.3
  front_offset_m: 4.0
  zone_slot_counts: {A: 2000, B: 4000, C: 4000}
  sku_count: 7200
  families: 260
  heavy_threshold_kg: 10
  heavy_allowed_levels: [1, 2]
  velocity_shrinkage_grid: [0.0, 0.25, 0.5, 1.0]   # chosen by internal validation on training picks
  reach_penalty_m: 0.0               # extra metres-equivalent per level 4-5 slot in slot ranking
  pick_orders: 30000                 # ~65 days of pick history at volume_weight 1.0
  batch_size: 3
  walk_speed_mps: 0.9
  pick_seconds_base: 9.0
  pick_seconds_upper_levels: 7.0     # levels 4-5 need reach / step ladder
  pick_seconds_heavy_upper: 12.0     # heavy item handled above approved level
  tour_setup_seconds: 60
  picker_wage_per_hour: 185

simulation:
  replications: 200
  search_replications: 30
  shift_start_min: 360
  shift_end_min: 1320
  wave_interval_min: 30
  pick_line_seconds_mean: 45
  pick_line_seconds_sd: 10
  pack_minutes: [3, 8]
  qc_rate: 0.05
  qc_minutes_mean: 4.0
  qc_minutes_sd: 1.0
  dispatch_minutes: [2, 6]
  cycle_time_target_min: 120
  baseline_staffing: {pickers: 5, packers: 3, qc: 1, loaders: 2}
  staffing_cost_per_shift: {pickers: 1480, packers: 1400, qc: 1700, loaders: 1350}
  staffing_search_bounds: {pickers: [2, 24], packers: [1, 16], qc: [1, 3], loaders: [1, 6]}
  diwali_peak_factor: auto   # auto = peak-day volume / representative-day volume from orders

network:
  p_values: [1, 2, 3, 4, 5]
  mfc_area_sqft: 4500
  mfc_capex_inr: 6500000          # racking, fit-out, IT, MHE, deposits
  mfc_staff_cost_per_year: 2100000   # scaled by city wage_index
  mfc_utilities_per_year: 480000
  mfc_capacity_orders_per_day: 450
  eligible_segments: [ECOM_B2C]   # B2B bulk keeps shipping from DC/hub
  linehaul_cost_per_km: 32
  linehaul_trips_per_day: 2
  wacc: 0.12
  horizon_years: 5
  demand_growth: 0.18
  sla_minutes: 120
  sla_processing_minutes: 40
  sla_traffic_factor: 2.2        # promise must hold at evening peak
  sla_speed_kmph: 28
  sensitivity:
    wacc: [0.10, 0.12, 0.14]
    capex_pct: [-0.2, 0.0, 0.2]
    growth: [0.08, 0.18, 0.28]
    variable_cost_pct: [-0.2, 0.0, 0.2]

ml:
  validation_days: 21
  random_state: 42
  gbr: {n_estimators: 300, max_depth: 3, learning_rate: 0.05, subsample: 0.85}


# -----------------------------------------------------------------------------
# Master data register: every parameter a reader should be able to audit.
# `key` is a dotted path into this file; value is resolved at export time.
# -----------------------------------------------------------------------------
register:
  - {key: project.seed, unit: "-", rationale: "Fixed seed so every run reproduces identical data and results", modules: [all]}
  - {key: calendar.start_date, unit: date, rationale: "90-day window covering monsoon tail, festive sales and Diwali", modules: [data, ml, simulation]}
  - {key: calendar.days, unit: days, rationale: "Planning history length specified for the scenario", modules: [data, ml]}
  - {key: calendar.diwali_date, unit: date, rationale: "Diwali 2025 (Lakshmi Puja); national peak build-up precedes it", modules: [data, fleet, simulation]}
  - {key: cities.MUM.volume_weight, unit: index, rationale: "Mumbai MMR (Maharashtra) order volume relative to base", modules: [data]}
  - {key: cities.DEL.volume_weight, unit: index, rationale: "Delhi NCR (Delhi, Haryana, UP) order volume relative to base", modules: [data]}
  - {key: cities.BLR.volume_weight, unit: index, rationale: "Bengaluru (Karnataka) order volume relative to base", modules: [data]}
  - {key: cities.CHE.volume_weight, unit: index, rationale: "Chennai (Tamil Nadu) order volume relative to base", modules: [data]}
  - {key: cities.KOL.volume_weight, unit: index, rationale: "Kolkata (West Bengal) order volume relative to base", modules: [data]}
  - {key: cities.BLR.congestion, unit: index, rationale: "Observed travel-time index in Bengaluru trip logs (highest congestion)", modules: [data, ml]}
  - {key: cities.CHE.rain_probability_by_month, unit: probability, rationale: "North-east monsoon raises Oct-Nov rain days in Chennai", modules: [data, ml]}
  - {key: cities.KOL.events, unit: event list, rationale: "Durga Puja: B2B shutdown and heavy pandal traffic in Kolkata", modules: [data, ml, simulation]}
  - {key: cities.DEL.events, unit: event list, rationale: "Chhath Puja demand dip in Delhi NCR", modules: [data, ml]}
  - {key: cities.MUM.events, unit: event list, rationale: "Ganesh Visarjan processions in Mumbai", modules: [data, ml]}
