# =============================================================================
# Project 6 — Logistics and Network Design
# Multi-state scenario: five metro clusters across Maharashtra, Delhi,
# Haryana, Uttar Pradesh, Karnataka, Tamil Nadu and West Bengal.
# Every numeric assumption lives here and is listed in the master register.
# Units: distances km, times minutes-since-midnight unless stated, money INR.
# =============================================================================

project:
  name: Logistics and Network Design
  portfolio_output: 6
  currency: INR
  seed: 42

paths:
  data_dir: data/logistics
  output_dir: outputs/logistics
  maps_dir: outputs/logistics/maps
  tables_dir: outputs/logistics/tables
  bi_dir: outputs/logistics/bi
  command_center_dir: outputs/command_center
  workbook: outputs/logistics_and_network_design.xlsx
  static_payload: dashboard/static/data/payload.json

calendar:
  start_date: "2025-09-01"
  days: 90
  diwali_date: "2025-10-20"
  # National events (all clusters). City events are listed under each city.
  events:
    - {name: Festive sale wave 1, start: "2025-09-23", end: "2025-10-05", b2c: 1.50, b2b: 1.15, traffic: 1.05}
    - {name: Navratri dealer stocking, start: "2025-09-22", end: "2025-10-17", b2c: 1.00, b2b: 1.20, traffic: 1.00}
    - {name: Dussehra holiday, start: "2025-10-02", end: "2025-10-02", b2c: 0.85, b2b: 0.30, traffic: 0.90}
    - {name: Diwali peak, start: "2025-10-10", end: "2025-10-19", b2c: 1.90, b2b: 1.35, traffic: 1.10}
    - {name: Diwali holidays, start: "2025-10-20", end: "2025-10-23", b2c: 0.65, b2b: 0.35, traffic: 0.85}
  weekday_factor:
    b2c: [1.10, 1.05, 1.00, 1.00, 1.00, 0.95, 0.85]   # Mon..Sun
    b2b: [1.05, 1.05, 1.05, 1.05, 1.05, 0.80, 0.25]

